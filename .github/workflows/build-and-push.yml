name: build-and-push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: remindme-prefix

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi‑arch image and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/remindme-prefix:latest
            ghcr.io/${{ github.repository_owner }}/remindme-prefix:${{ github.sha }}
          visibility: public
